<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Discovery</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🎬 Movie Discovery</h1>
  <button id="themeBtn" type="button">🌙 Chế độ tối</button>
</header>

<div class="layout">
  <aside>
    <h3>Tìm kiếm phim</h3>
    <input type="text" id="search" placeholder="Nhập tên phim...">
    <h3>Thể loại</h3>
    <div id="genres"></div>
    <button id="clear" type="button">Xóa bộ lọc</button>
  </aside>

  <main>
    <h2>Khám phá phim</h2>
    <p id="count"></p>
    <div class="grid" id="grid"></div>

    <section class="baitap">
      <h3>Kết quả các bài tập trước</h3>

      <div class="bt-item">
        <details>
          <summary>Bài 37 - bấm để xem ảnh kết quả</summary>
          <div class="bt-images">
            <img src="images/bai37-1.png" alt="Bài 37 - ảnh 1">
            <img src="images/bai37-2.png" alt="Bài 37 - ảnh 2">
          </div>
        </details>
      </div>

      <div class="bt-item">
        <details>
          <summary>Bài 38 - bấm để xem ảnh kết quả</summary>
          <div class="bt-images">
            <img src="images/bai38-1.png" alt="Bài 38 - ảnh 1">
            <img src="images/bai38-2.png" alt="Bài 38 - ảnh 2">
          </div>
        </details>
      </div>

      <div class="bt-item">
        <h4>Bài 39</h4>
        <a href="https://piiemm18122006-cpu.github.io/bai39/bt39.html" target="_blank" rel="noopener">Xem kết quả bài 39</a>
      </div>
    </section>
  </main>
</div>

<div id="modal">
  <div class="box">
    <button id="close" type="button" aria-label="Đóng">&times;</button>
    <div id="detail"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
